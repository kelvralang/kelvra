name: Republish Existing VS Code Release to Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vscode/vX.Y.Z GitHub release tag containing tested VSIX assets
        required: true
        default: vscode/v0.2.0
        type: string
      channel:
        description: Marketplace release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - pre-release

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^vscode/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vscode/vX.Y.Z release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/vscode-kelvra/package-lock.json
      - name: Install pinned publisher tooling
        working-directory: tooling/vscode-kelvra
        run: npm ci
      - name: Download the tested GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'vscode-kelvra-*.vsix' --dir dist
          test -n "$(find dist -maxdepth 1 -name '*.vsix' -print -quit)"
      - name: Publish released VSIX files to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PRERELEASE: ${{ inputs.channel == 'pre-release' }}
        run: |
          for package in dist/*.vsix; do
            prerelease=()
            [[ "$PRERELEASE" == true ]] && prerelease=(--pre-release)
            ./tooling/vscode-kelvra/node_modules/.bin/vsce publish \
              "${prerelease[@]}" --skip-duplicate --packagePath "$package"
          done
